<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Barrio Piloto</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774089.png">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3774/3774089.png">
<meta name="theme-color" content="#FF5722">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>body{margin:0;font-family:sans-serif}#map{height:100vh;width:100vw}#btn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);z-index:1000;background:#FF5722;color:white;border:none;padding:18px 28px;border-radius:30px;font-size:18px;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,0.3)}#status{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:1000;background:white;padding:10px 18px;border-radius:20px;display:none}#where{position:fixed;top:60px;right:15px;z-index:1000;background:#2196F3;color:white;border:none;padding:10px 16px;border-radius:20px;font-weight:bold;display:none}</style>
</head>
<body>
<div id="map"></div>
<div id="status"></div>
<button id="where" onclick="irAlAuto()">📍 VER MI AUTO</button>
<button id="btn" onclick="guardarAuto()">🚗 GUARDE MI AUTO ACA</button>
<script>
const MONTE_GRANDE=[-34.815,-58.47];let map=L.map('map').setView(MONTE_GRANDE,16);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);let miUbicacion=null, marcadorMio=null, marcadorAuto=null;
function showStatus(t,m=3000){const e=document.getElementById('status');e.textContent=t;e.style.display='block';if(m)setTimeout(()=>e.style.display='none',m);}
function actualizarMiPosicion(p){const lat=p.coords.latitude,lng=p.coords.longitude;miUbicacion={lat,lng};if(!marcadorMio){marcadorMio=L.circleMarker([lat,lng],{radius:10,color:'white',fillColor:'#2196F3',fillOpacity:1,weight:3}).addTo(map);map.setView([lat,lng],18);}else marcadorMio.setLatLng([lat,lng]);}
function iniciarGPS(){showStatus("Buscando tu ubicación REAL...",0);navigator.geolocation.getCurrentPosition((p)=>{actualizarMiPosicion(p);document.getElementById('status').style.display='none';navigator.geolocation.watchPosition(actualizarMiPosicion,null,{enableHighAccuracy:true});},(e)=>{showStatus("Activa GPS: "+e.message,5000);},{enableHighAccuracy:true,timeout:15000});}
function guardarAuto(){if(!miUbicacion){showStatus("Esperando GPS...");iniciarGPS();return;}navigator.geolocation.getCurrentPosition((p)=>{const d={lat:p.coords.latitude,lng:p.coords.longitude,time:new Date().toISOString()};localStorage.setItem('miAuto',JSON.stringify(d));if(marcadorAuto)map.removeLayer(marcadorAuto);marcadorAuto=L.marker([d.lat,d.lng]).addTo(map).bindPopup("<b>Auto guardado!</b>").openPopup();map.setView([d.lat,d.lng],19);document.getElementById('where').style.display='block';showStatus("✅ Auto guardado!",4000);},{},{enableHighAccuracy:true});}
function irAlAuto(){const r=localStorage.getItem('miAuto');if(!r)return;const d=JSON.parse(r);map.setView([d.lat,d.lng],19);}
try{const r=localStorage.getItem('miAuto');if(r){const d=JSON.parse(r);marcadorAuto=L.marker([d.lat,d.lng]).addTo(map);document.getElementById('where').style.display='block';}}catch(e){}iniciarGPS();
</script>
</body>
</html>
