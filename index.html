<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Mi Barrio Piloto PRO</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png?v=4">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3202/3202926.png?v=4">
<meta name="theme-color" content="#FF5722">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
body{margin:0;font-family:sans-serif;overflow:hidden}
#map{height:100vh;width:100vw}
.panel{position:fixed;left:10px;right:10px;bottom:90px;z-index:1000;background:white;border-radius:18px;padding:14px;box-shadow:0 8px 25px rgba(0,0,0,.25);display:none}
#btnMain{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:1001;background:#FF5722;color:white;border:none;padding:18px 26px;border-radius:30px;font-size:17px;font-weight:bold;box-shadow:0 4px 15px rgba(0,0,0,.3)}
.topBtn{position:fixed;top:10px;z-index:1000;padding:10px 14px;border-radius:20px;border:none;font-weight:bold;color:white}
#btnVer{right:10px;background:#2196F3;display:none}
#btnCompass{left:10px;background:#4CAF50;display:none}
#compass{font-size:50px;text-align:center;transition:transform .3s}
.row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.row button{flex:1;padding:12px;border-radius:12px;border:none;font-weight:bold}
.b1{background:#FFE0B2}.b2{background:#B3E5FC}.b3{background:#C8E6C9}.b4{background:#FFCDD2}
#fotoPrev{width:100%;max-height:150px;object-fit:cover;border-radius:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div id="map"></div>
<button id="btnVer" class="topBtn" onclick="irAlAuto()">📍 MI AUTO</button>
<button id="btnCompass" class="topBtn" onclick="togglePanel()">🧭 BRÚJULA</button>

<div id="panel" class="panel">
  <div id="compass">🧭</div>
  <div id="infoDist" style="text-align:center;font-weight:bold">Buscando...</div>
  <img id="fotoPrev" />
  <div class="row">
    <button class="b1" onclick="tomarFoto()">📸 Foto</button>
    <button class="b2" onclick="compartir()">📤 Compartir</button>
  </div>
  <div class="row">
    <button class="b3" onclick="ponerAlarma(60)">⏰ 1 hora</button>
    <button class="b3" onclick="ponerAlarma(120)">⏰ 2 horas</button>
    <button class="b4" onclick="borrar()">🗑️ Borrar</button>
  </div>
</div>

<button id="btnMain" onclick="guardarAuto()">🚗 GUARDAR MI AUTO ACA</button>
<input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none">

<script>
const MG=[-34.815,-58.47]; let map=L.map('map').setView(MG,16);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
let miUbicacion=null,mMio=null,mAuto=null,watchId=null,lastFoto=null;

function dist(lat1,lon1,lat2,lon2){ const R=6371e3; const a=lat1*Math.PI/180,b=lat2*Math.PI/180; const dLat=(lat2-lat1)*Math.PI/180; const dLon=(lon2-lon1)*Math.PI/180; const h=Math.sin(dLat/2)**2+Math.cos(a)*Math.cos(b)*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(h),Math.sqrt(1-h));}
function bearing(lat1,lon1,lat2,lon2){ const y=Math.sin((lon2-lon1)*Math.PI/180)*Math.cos(lat2*Math.PI/180); const x=Math.cos(lat1*Math.PI/180)*Math.sin(lat2*Math.PI/180)-Math.sin(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.cos((lon2-lon1)*Math.PI/180); return (Math.atan2(y,x)*180/Math.PI+360)%360;}

function actualizarCompass(){
  const raw=localStorage.getItem('miAuto'); if(!raw||!miUbicacion) return;
  const d=JSON.parse(raw); const di=dist(miUbicacion.lat,miUbicacion.lng,d.lat,d.lng); const be=bearing(miUbicacion.lat,miUbicacion.lng,d.lat,d.lng);
  document.getElementById('infoDist').innerText=`${di<1000?Math.round(di)+' m':(di/1000).toFixed(2)+' km'} - Rumbo ${Math.round(be)}°`;
  document.getElementById('compass').style.transform=`rotate(${be}deg)`;
  if(di<20) document.getElementById('infoDist').innerText='¡ESTAS AL LADO DEL AUTO! 🎉 '+document.getElementById('infoDist').innerText;
}

function upd(p){ miUbicacion={lat:p.coords.latitude,lng:p.coords.longitude}; if(!mMio){ mMio=L.circleMarker([miUbicacion.lat,miUbicacion.lng],{radius:10,color:'white',fillColor:'#2196F3',fillOpacity:1,weight:3}).addTo(map); map.setView([miUbicacion.lat,miUbicacion.lng],18);} else mMio.setLatLng([miUbicacion.lat,miUbicacion.lng]); actualizarCompass();}

function guardarAuto(){
  navigator.geolocation.getCurrentPosition(p=>{
    const data={lat:p.coords.latitude,lng:p.coords.longitude,time:new Date().toISOString(),foto:lastFoto||localStorage.getItem('miAutoFoto')||null};
    localStorage.setItem('miAuto',JSON.stringify(data));
    if(mAuto) map.removeLayer(mAuto); mAuto=L.marker([data.lat,data.lng]).addTo(map).bindPopup('🚗 Auto acá').openPopup();
    map.setView([data.lat,data.lng],19);
    document.getElementById('btnVer').style.display='block'; document.getElementById('btnCompass').style.display='block';
    document.getElementById('panel').style.display='block';
    if(data.foto){ const im=document.getElementById('fotoPrev'); im.src=data.foto; im.style.display='block';}
    alert('✅ Auto guardado! Brújula y fotos activadas');
  },null,{enableHighAccuracy:true});
}

function irAlAuto(){ const r=localStorage.getItem('miAuto'); if(!r) return; const d=JSON.parse(r); map.setView([d.lat,d.lng],19); document.getElementById('panel').style.display='block';}
function togglePanel(){ const p=document.getElementById('panel'); p.style.display=p.style.display==='none'?'block':'none';}
function tomarFoto(){ document.getElementById('inputFoto').click(); }
document.getElementById('inputFoto').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=ev=>{ lastFoto=ev.target.result; localStorage.setItem('miAutoFoto',lastFoto); const im=document.getElementById('fotoPrev'); im.src=lastFoto; im.style.display='block';}; r.readAsDataURL(f);}

function compartir(){
  const r=localStorage.getItem('miAuto'); if(!r) return alert('Primero guarda el auto');
  const d=JSON.parse(r); const url=`https://www.google.com/maps?q=${d.lat},${d.lng}`;
  if(navigator.share){ navigator.share({title:'Mi auto está acá',text:'Mirá donde dejé el auto 🚗',url});}
  else{ navigator.clipboard.writeText(url); window.open(`https://wa.me/?text=${encodeURIComponent('Mi auto está acá 🚗 '+url)}`); }
}

function ponerAlarma(min){ setTimeout(()=>{ alert('⏰ ¡ALARMA! Hora de volver al auto - hace '+min+' min que lo dejaste'); if('vibrate' in navigator) navigator.vibrate([500,200,500]); }, min*60*1000); alert(`⏰ Alarma puesta en ${min} minutos`);}

function borrar(){ localStorage.removeItem('miAuto'); localStorage.removeItem('miAutoFoto'); if(mAuto) map.removeLayer(mAuto); document.getElementById('panel').style.display='none'; document.getElementById('btnVer').style.display='none'; document.getElementById('btnCompass').style.display='none'; alert('Borrado');}

// inicio
try{ const r=localStorage.getItem('miAuto'); if(r){ const d=JSON.parse(r); mAuto=L.marker([d.lat,d.lng]).addTo(map); document.getElementById('btnVer').style.display='block'; document.getElementById('btnCompass').style.display='block'; const f=localStorage.getItem('miAutoFoto'); if(f){ lastFoto=f; const im=document.getElementById('fotoPrev'); im.src=f; im.style.display='block'; } } }catch(e){}
navigator.geolocation.watchPosition(upd,null,{enableHighAccuracy:true});
</script>
</body>
</html>
